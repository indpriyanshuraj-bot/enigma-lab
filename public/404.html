<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>404 — that page was not on the wiring board</title>
		<meta name="robots" content="noindex" />
		<link rel="icon" href="./favicon.svg" type="image/svg+xml" />
		<style>
			:root {
				color-scheme: dark;
				--bg: #0b0f14;
				--fg: #e6edf3;
				--dim: #8b98a5;
				--accent: #d6a94a;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100dvh;
				display: grid;
				place-items: center;
				background: radial-gradient(circle at 50% 0%, #16202b, var(--bg) 70%);
				color: var(--fg);
				font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
				padding: 2rem;
			}
			main {
				max-width: 34rem;
				text-align: center;
			}
			code {
				color: var(--accent);
				font-family: ui-monospace, "SF Mono", Menlo, monospace;
			}
			h1 {
				font-size: clamp(1.5rem, 5vw, 2.25rem);
				margin: 0 0 0.75rem;
				letter-spacing: -0.02em;
			}
			p {
				color: var(--dim);
				line-height: 1.6;
				margin: 0 0 1.5rem;
			}
			a {
				display: inline-block;
				padding: 0.7rem 1.1rem;
				border-radius: 0.6rem;
				border: 1px solid #2a3644;
				color: var(--fg);
				text-decoration: none;
				background: #131b24;
			}
			a:hover {
				border-color: var(--accent);
			}
		</style>
	</head>
	<body>
		<main>
			<h1>404 — no such contact</h1>
			<p>
				The reflector never sent this path back. A real Enigma cannot encode a letter as itself either, so consider this
				page the machine's one honest answer.
			</p>
			<a href="./">Back to the machine</a>
		</main>
	</body>
</html>
