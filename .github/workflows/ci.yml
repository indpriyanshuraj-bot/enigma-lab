name: ci

on:
  pull_request:
  workflow_dispatch:
  # The release workflow calls this file rather than repeating its steps, so a
  # release is gated on exactly the checks a pull request is.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  BASE_PATH: /${{ github.event.repository.name }}/

jobs:
  verify:
    name: verify (node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - run: corepack enable

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache the pinned library tarball
        uses: actions/cache@v6
        with:
          path: vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('lib.lock.json') }}

      - run: pnpm install --frozen-lockfile --prefer-offline

      - name: Fetch the pinned core release
        run: pnpm run lib

      - run: pnpm run typecheck

      - run: pnpm run build

      - run: pnpm test

      - name: Report bundle weight
        run: |
          du -sh dist
          find dist/assets -type f -printf '%s %p\n' | sort -rn | head -8

  browser:
    name: browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - run: corepack enable

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache the pinned library tarball
        uses: actions/cache@v6
        with:
          path: vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('lib.lock.json') }}

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build
      - run: pnpm exec playwright test

      - name: Upload the failure report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
