name: release

# A tag publishes the exact bytes that passed CI, as a zip of dist/.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and test, but do not publish a release
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  # One definition of "green": the same workflow every pull request runs.
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish release
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - run: corepack enable

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache the pinned library tarball
        uses: actions/cache@v6
        with:
          path: vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('lib.lock.json') }}

      - run: pnpm install --frozen-lockfile --prefer-offline

      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          echo "package.json=$version tag=$tag"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag v$tag does not match package.json version $version"
            exit 1
          fi

      - name: Build the site
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm run build

      - name: Pack the deployable site
        run: |
          cd dist
          zip -qr "../enigma-lab-site-${GITHUB_REF_NAME}.zip" .
          cd ..
          sha256sum enigma-lab-site-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes for this version only
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > RELEASE_NOTES.md && cat RELEASE_NOTES.md

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'enigma-lab-site-*.zip'

      - name: Publish GitHub release
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            enigma-lab-site-*.zip SHA256SUMS.txt \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag
